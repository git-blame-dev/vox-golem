[package]
name = "vox-golem"
edition.workspace = true
publish = false
build = "build.rs"

[features]
app-benchmark = ["voxgolem-audio/benchmark-input", "voxgolem-platform/app-benchmark"]

[lib]
name = "vox_golem_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
espeak-rs = { version = "0.1.9", default-features = false }
futures-util = "0.3"
hound = "3"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", features = ["ndarray", "cuda"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "signal", "sync", "test-util", "time"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
thiserror = "2"
toml = "0.8"
transcribe-rs = { version = "=0.3.11", features = ["onnx"] }
voxgolem-audio = { path = "../../../crates/audio" }
voxgolem-conversation-store = { path = "../../../crates/conversation-store" }
voxgolem-core = { path = "../../../crates/core" }
voxgolem-model = { path = "../../../crates/model" }
voxgolem-platform = { path = "../../../crates/platform", features = ["web-search"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "=2.4.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
