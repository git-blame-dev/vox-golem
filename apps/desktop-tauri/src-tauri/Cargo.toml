[package]
name = "vox-golem"
edition.workspace = true
publish = false
build = "build.rs"

[lib]
name = "vox_golem_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
espeak-rs = { version = "0.1.9", default-features = false }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", features = ["ndarray", "cuda"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
minisign-verify = "0.2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
semver = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "signal", "sync", "test-util", "time"] }
tauri = { version = "2", features = ["protocol-asset"] }
thiserror = "2"
transcribe-rs = { version = "=0.3.11", features = ["onnx"] }
voxgolem-audio = { path = "../../../crates/audio" }
voxgolem-core = { path = "../../../crates/core" }
voxgolem-model = { path = "../../../crates/model" }
voxgolem-platform = { path = "../../../crates/platform" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_8"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "=2.4.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
hound = "3"

[lints]
workspace = true
