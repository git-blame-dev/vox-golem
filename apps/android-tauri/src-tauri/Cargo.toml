[package]
name = "vox-golem-android"
edition.workspace = true
publish = false
build = "build.rs"

[lib]
name = "vox_golem_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
voxgolem-core = { path = "../../../crates/core", default-features = false }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
