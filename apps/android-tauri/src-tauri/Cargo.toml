[package]
name = "vox-golem-android"
edition.workspace = true
publish = false
build = "build.rs"

[lib]
name = "vox_golem_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.1", features = ["protocol-asset"] }
tauri-plugin-capture = { path = "../../../crates/capture-plugin" }
tauri-plugin-assistant = { path = "../../../crates/assistant-plugin" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
