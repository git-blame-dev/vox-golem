org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Temporary AGP 9 migration bridge: shared Android modules still use
# kotlin-android and android.kotlinOptions in the phone's AGP 8 build.
# Remove both opt-outs after a coordinated built-in Kotlin migration.
# https://developer.android.com/build/migrate-to-built-in-kotlin#opt-out-of-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
