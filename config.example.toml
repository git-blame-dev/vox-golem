# Local voice assets
wake_word_model_path = "models/hey_livekit.onnx"
parakeet_model_dir = "models/parakeet-v2"
silero_vad_model = "models/silero-vad.onnx"
silence_timeout_ms = 1500
wake_word_detection_threshold = 0.68

response_backend = "opencode"

[opencode]
path = "opencode/opencode.exe"

[llama_cpp]
server_path = "llama/bin/llama-server.exe"
host = "127.0.0.1"
port = 11435
fast_model_path = "models/llama/gemma-3-1b-it-Q4_K_M.gguf"
quality_model_path = "models/llama/google_gemma-3-4b-it-Q6_K_L.gguf"

[tts]
enabled = true
model_path = "models/tts/jarvis.onnx"
worker_count = 1
max_queue = 8
sample_rate_hz = 22050
