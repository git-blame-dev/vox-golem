# Linux example. All tables are optional; paths are relative to this file.
# Model files are intentionally external: Vox Golem does not download them.
# Web lookup permission is independent of Quick/Verify/Research effort.
web_enabled = true
wake_word_model_path = "models/hey_livekit.onnx"
parakeet_model_dir = "models/parakeet-v2"
silero_vad_model = "models/silero-vad.onnx"
initial_silence_timeout_ms = 2500
silence_timeout_ms = 750
wake_word_detection_threshold = 0.68
response_backend = "llama_cpp"

[opencode]
path = "opencode/opencode"
runtime = "native" # Windows may use "wsl" and omit path for discovery.

[llama_cpp]
server_path = "llama/bin/llama-server"
host = "127.0.0.1"
port = 11435
fast_model_path = "models/llama/fast.gguf"
quality_model_path = "models/llama/quality.gguf"
inference_provider = "auto" # auto, cuda, or cpu

[custom_openai]
endpoint = "https://chatgpt.com/backend-api/codex/responses"
# Sign-in is via the in-app device-code flow in Settings -> Model -> Continue with ChatGPT.

[completion]
server_path = "llama/bin/llama-server"
model_path = "models/llama/completion.gguf"
inference_provider = "auto" # auto, cuda, or cpu

[tts]
enabled = false
# Transitional default: "piper". Select "neural" for the local Neural TTS service.
provider = "piper"
# Neural settings; the service owns its installed voices and models.
endpoint = "http://127.0.0.1:8765"
voice = ""
# Optional trusted executable + literal arguments; empty means externally managed.
start_command = []
# Piper settings remain available until Neural desktop acceptance.
model_path = "models/tts/jarvis.onnx"
worker_count = 1
max_queue = 8
sample_rate_hz = 22050
max_duration_s = 300
output_gain_db = 3

[telemetry]
# Categorical native model diagnostics. Both streams share one bounded writer.
enabled = true
# Shared diagnostics file size and backup-slot budget (also applies to logging).
# Total JSONL bytes <= max_bytes * (backup_count + 1); max age 90 days.
max_bytes = 10485760
backup_count = 3

[logging]
# Categorical frontend/TTS diagnostics; never freeform text or raw errors.
enabled = false
