[package]
name = "voxgolem-platform"
edition.workspace = true

[features]
app-benchmark = ["custom-openai"]
default = ["desktop", "custom-openai"]
web-search = [
  "dep:httpdate",
  "custom-openai-webpki",
  "dep:rmcp",
  "dep:voxgolem-core",
  "tokio/macros",
  "tokio/rt",
  "tokio/sync",
]
custom-openai = [
  "dep:voxgolem-core",
  "dep:futures-util",
  "dep:reqwest",
  "reqwest/json",
  "reqwest/rustls",
  "reqwest/stream",
  "dep:tokio",
  "tokio/time",
  "tokio/net",
  "tokio/rt-multi-thread",
  "tokio/sync",
]
custom-openai-webpki = [
  "dep:voxgolem-core",
  "dep:futures-util",
  "dep:reqwest",
  "reqwest/json",
  "reqwest/rustls-no-provider",
  "reqwest/stream",
  "dep:rustls",
  "dep:tokio",
  "tokio/time",
  "tokio/net",
  "tokio/rt-multi-thread",
  "tokio/sync",
  "dep:webpki-roots",
]
desktop = [
  "dep:voxgolem-core",
  "dep:futures-util",
  "dep:rand",
  "dep:reqwest",
  "reqwest/json",
  "reqwest/rustls",
  "reqwest/stream",
  "dep:tokio",
  "tokio/macros",
  "tokio/net",
  "tokio/process",
  "tokio/sync",
  "tokio/time",
  "dep:win32job",
  "dep:windows",
]

[dependencies]
httpdate = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"], optional = true }
voxgolem-core = { path = "../core", default-features = false, optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", default-features = false, optional = true }
rand = { version = "0.9", optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std", "process"] }

[target.'cfg(windows)'.dependencies]
win32job = { version = "2.0.3", optional = true }
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

# Match workspace lints, except permit the single audited Windows binding call
# in managed_process. All other unsafe code remains denied in this crate.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = "deny"
