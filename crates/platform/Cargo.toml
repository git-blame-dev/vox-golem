[package]
name = "voxgolem-platform"
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "process", "time", "net", "sync"] }
rand = "0.9"

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[lints]
workspace = true
