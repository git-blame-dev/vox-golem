name: Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      VOXGOLEM_SMOKE_NAMESPACE_MODE: privileged-network
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev cmake ninja-build clang lld llvm pkg-config jq p7zip-full espeak-ng ffmpeg xvfb
      - run: cargo install tauri-cli --version 2.11.1 --locked
      - name: Prepare deterministic synthetic speech tools
        run: |
          scripts/prepare-synthetic-speech-tools.sh "$RUNNER_TEMP/synthetic-speech"
          printf '%s/bin\n' "$RUNNER_TEMP/synthetic-speech" >> "$GITHUB_PATH"
      - run: make test

  android-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Configure isolated Android user directory
        run: |
          printf 'ANDROID_USER_HOME=%s/voxgolem-android-user\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/voxgolem-android-user"
      - name: Configure the pinned Android build tools
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_21_X64" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          # Tauri CLI 2.11.1 replaces NDK_HOME with the last sorted SDK ndk entry.
          # Expose only the project NDK without removing runner-installed packages.
          pinned_sdk="$RUNNER_TEMP/voxgolem-android-sdk"
          mkdir -p "$pinned_sdk/ndk"
          for entry in "$ANDROID_HOME"/*; do
            if [ "$(basename "$entry")" != ndk ]; then
              ln -s "$entry" "$pinned_sdk/"
            fi
          done
          ln -s "$ANDROID_HOME/ndk/28.2.13676358" "$pinned_sdk/ndk/28.2.13676358"
          test -x "$pinned_sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nNDK_HOME=%s/ndk/28.2.13676358\n' \
            "$pinned_sdk" "$pinned_sdk" "$pinned_sdk" >> "$GITHUB_ENV"
          cargo install tauri-cli --version 2.11.1 --locked
          bun install --frozen-lockfile
      - name: Fetch locked Rust dependencies for offline JNI builds
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host_target"
          cargo fetch --locked --target "$host_target" \
            --target aarch64-linux-android --target armv7-linux-androideabi
      - name: Check Android CI signing preconditions
        run: bash scripts/test-android-signing-workflow.sh
      - name: Build the ARM64 debug app
        run: make android-build
      - name: Check SDK-only voice without JNI tasks
        run: make android-voice-test
      - name: Check SDK-only voice and native capture
        run: make android-capture-test
      - name: Check shared and phone Assistant
        run: make android-assistant-test
      - name: Build the optimized ARM64 release app
        env:
          ORG_GRADLE_PROJECT_voxgolemCaptureTiming: 'false'
        run: make android-release
      - name: Sign and verify the optimized phone CI trial
        run: |
          build=apps/android-tauri/src-tauri/gen/android/app/build
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=android-optimized-ci/vox-golem-android-optimized-ci-arm64.apk
          test -s "$build/outputs/apk/universal/release/app-universal-release-unsigned.apk" || {
            printf '%s\n' '::error::Android CI signing precondition missing: apk' >&2
            exit 1
          }
          test -s "$build/outputs/mapping/universalRelease/mapping.txt" || {
            printf '%s\n' '::error::Android CI signing precondition missing: mapping' >&2
            exit 1
          }
          test -f "$ANDROID_USER_HOME/debug.keystore" || {
            printf '%s\n' '::error::Android CI signing precondition missing: keystore' >&2
            exit 1
          }
          mkdir android-optimized-ci
          "$tools/zipalign" -P 16 -f 4 \
            "$build/outputs/apk/universal/release/app-universal-release-unsigned.apk" \
            android-optimized-ci/aligned.apk
          "$tools/apksigner" sign --ks "$ANDROID_USER_HOME/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out "$apk" android-optimized-ci/aligned.apk
          rm android-optimized-ci/aligned.apk
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee android-optimized-ci/signature.txt
          "$tools/apksigner" verify --print-certs \
            "$build/outputs/apk/universal/debug/app-universal-debug.apk" > android-optimized-ci/debug-signature.txt
          grep '^Signer #1 certificate SHA-256 digest:' android-optimized-ci/signature.txt > android-optimized-ci/release-cert.txt
          grep '^Signer #1 certificate SHA-256 digest:' android-optimized-ci/debug-signature.txt > android-optimized-ci/debug-cert.txt
          cmp android-optimized-ci/release-cert.txt android-optimized-ci/debug-cert.txt
          "$tools/aapt" dump badging "$apk" > android-optimized-ci/badging.txt
          grep -q "^package: name='dev.gitblame.voxgolem.android' " android-optimized-ci/badging.txt
          grep -Fx "native-code: 'arm64-v8a'" android-optimized-ci/badging.txt
          if grep -q '^application-debuggable' android-optimized-ci/badging.txt; then
            printf '%s\n' 'Optimized CI APK must not be debuggable.' >&2
            exit 1
          fi
          unzip -Z1 "$apk" > android-optimized-ci/entries.txt
          grep -Fx 'lib/arm64-v8a/libvox_golem_android_lib.so' android-optimized-ci/entries.txt
          grep -Fx 'lib/arm64-v8a/libwear_assistant_native.so' android-optimized-ci/entries.txt
          if grep -Eq '^lib/.*/(gdbserver|lldb-server|wrap\.sh)$' android-optimized-ci/entries.txt; then
            printf '%s\n' 'Optimized CI APK contains native debug launch helpers.' >&2
            exit 1
          fi
          native_dir="$(mktemp -d)"
          trap 'rm -rf "$native_dir"' EXIT
          unzip -j "$apk" 'lib/arm64-v8a/*.so' -d "$native_dir"
          for library in "$native_dir/"*.so; do
            header="android-optimized-ci/$(basename "$library").elf-header.txt"
            "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$library" > "$header"
            grep -Eq 'Machine: +AArch64$' "$header"
          done
          cp "$build/outputs/mapping/universalRelease/mapping.txt" android-optimized-ci/mapping.txt
          (cd android-optimized-ci && sha256sum vox-golem-android-optimized-ci-arm64.apk > SHA256SUMS)
      - name: Check and build debug and optimized Wear companions
        run: make wear-test wear-build wear-performance
      - name: Verify the APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            apps/android-tauri/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            apps/wear/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            apps/wear/app/build/outputs/apk/performance/app-performance.apk
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: vox-golem-android-debug-arm64
          path: apps/android-tauri/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: vox-golem-android-optimized-ci-arm64-debug-key
          path: android-optimized-ci
          if-no-files-found: error
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: vox-golem-wear-debug
          path: apps/wear/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: vox-golem-wear-performance
          path: apps/wear/app/build/outputs/apk/performance/app-performance.apk

  native-artifact:
    runs-on: ubuntu-24.04
    env:
      VOXGOLEM_SMOKE_NAMESPACE_MODE: privileged-network
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev cmake ninja-build clang lld llvm patchelf pkg-config xvfb
      - run: cargo install tauri-cli --version 2.11.1 --locked
      - name: Determine application version
        id: app_version
        run: |
          commit_timestamp="$(git show -s --format=%ct HEAD)"
          version="$(scripts/release-version.sh "$commit_timestamp" "$GITHUB_RUN_NUMBER")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build updater AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make update-bundle
      - name: Stage the versioned Linux binary
        run: make stage-linux-existing
      - name: Smoke test staged package
        run: make packaged-smoke
      - name: Smoke test updater AppImage
        run: make update-bundle-smoke
      - name: Archive Linux artifacts with executable modes
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mapfile -t appimages < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          test "${#appimages[@]}" -eq 1
          cp "${appimages[0]}" dist/VoxGolem.AppImage
          printf '%s\n' "$APP_VERSION" > dist/APP_VERSION
          tar -C dist -czf vox-golem-linux.tar.gz VoxGolem VoxGolem.AppImage APP_VERSION
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: vox-golem-linux
          path: vox-golem-linux.tar.gz

  windows-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract clang-19 cmake file lld-19 llvm-19 llvm-19-tools ninja-build p7zip-full
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/n/nsis/nsis-common_3.09-4ubuntu1_all.deb
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/n/nsis/nsis_3.09-4ubuntu1_amd64.deb
          printf '%s  %s\n' \
            '49471b9debdee4751ebb4caf6b705cc4c678eebfaecefbe56362258893f85859' 'nsis-common_3.09-4ubuntu1_all.deb' \
            '9e061bef1a8b611aeb2ea76d9a3bd7722b960ca1a9dff8e38d2ab51e5a8f5e5b' 'nsis_3.09-4ubuntu1_amd64.deb' | sha256sum -c -
          sudo apt-get install -y ./nsis-common_3.09-4ubuntu1_all.deb ./nsis_3.09-4ubuntu1_amd64.deb
          cargo install cargo-xwin --version 0.23.0 --locked
          cargo install tauri-cli --version 2.11.1 --locked
      - name: Determine application version
        id: app_version
        run: |
          commit_timestamp="$(git show -s --format=%ct HEAD)"
          version="$(scripts/release-version.sh "$commit_timestamp" "$GITHUB_RUN_NUMBER")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify Windows installer
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: PATH="/usr/lib/llvm-19/bin:$PATH" make pc-installer
      - name: Stage Windows CI artifact
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          source="target/x86_64-pc-windows-msvc/release/bundle/nsis/VoxGolem_${APP_VERSION}_x64-setup.exe"
          asset="vox-golem-windows-x86_64-v${APP_VERSION}-setup.exe"
          test -f "$source"
          mkdir windows-package
          cp "$source" "windows-package/$asset"
          printf '%s\n' "$APP_VERSION" > windows-package/APP_VERSION
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: vox-golem-windows
          path: windows-package
