name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  BUN_VERSION: 1.3.9
  CARGO_TERM_COLOR: always
  LLVM_MAJOR_VERSION: 20
  TAURI_CLI_VERSION: 2.11.1

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install actionlint
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint

  linux-checks:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - workflow-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use stable Rust
        run: rustup default stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-linux-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-linux-checks-${{ runner.os }}-

      - name: Run deterministic checks
        run: make test

  windows-artifact:
    name: Windows artifact from Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - linux-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_MAJOR_VERSION}"
          sudo apt-get install -y --no-install-recommends cmake ninja-build unzip clang-${LLVM_MAJOR_VERSION} lld-${LLVM_MAJOR_VERSION} llvm-${LLVM_MAJOR_VERSION} llvm-${LLVM_MAJOR_VERSION}-tools
          printf '/usr/lib/llvm-%s/bin\n' "${LLVM_MAJOR_VERSION}" >> "$GITHUB_PATH"

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo registry and cross caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.cache/cargo-xwin
            ~/.cache/ort.pyke.io
          key: cargo-linux-windows-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-linux-windows-${{ runner.os }}-
            cargo-linux-checks-${{ runner.os }}-

      - name: Cache Cargo tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cargo/bin/cargo-tauri
          key: cargo-tools-${{ runner.os }}-tauri-${{ env.TAURI_CLI_VERSION }}

      - name: Install Cargo build tools
        run: |
          command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      - name: Cache CUDA runtime dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .deps/cuda-runtime
          key: cuda-runtime-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            cuda-runtime-${{ runner.os }}-

      - name: Build and stage Windows release files
        run: make pc-dist

      - name: Upload Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vox-golem-windows-app
          path: dist/VoxGolem
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
