name: Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev libespeak-dev cmake ninja-build clang lld llvm pkg-config
      - run: cargo install tauri-cli --version 2.11.1 --locked
      - run: make test

  native-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev libespeak-dev cmake ninja-build clang lld llvm pkg-config xvfb
      - run: cargo install tauri-cli --version 2.11.1 --locked
      - name: Determine application version
        id: app_version
        run: |
          commit_timestamp="$(git show -s --format=%ct HEAD)"
          version="$(scripts/release-version.sh "$commit_timestamp" "$GITHUB_RUN_NUMBER")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: make dist
      - name: Build updater AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make update-bundle
      - name: Smoke test staged package
        run: xvfb-run -a make packaged-smoke
      - name: Smoke test updater AppImage
        run: xvfb-run -a make update-bundle-smoke
      - name: Archive Linux artifacts with executable modes
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mapfile -t appimages < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          test "${#appimages[@]}" -eq 1
          cp "${appimages[0]}" dist/VoxGolem.AppImage
          printf '%s\n' "$APP_VERSION" > dist/APP_VERSION
          tar -C dist -czf vox-golem-linux.tar.gz VoxGolem VoxGolem.AppImage APP_VERSION
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: vox-golem-linux
          path: vox-golem-linux.tar.gz
