name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.9
  CARGO_TERM_COLOR: always
  LLVM_VERSION: 22.1.0
  SCCACHE_VERSION: 0.10.0
  TAURI_CLI_VERSION: 2.11.1

jobs:
  windows-rust:
    name: Windows fmt, clippy, and tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use stable Rust
        shell: pwsh
        run: rustup default stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-windows-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-${{ runner.os }}-

      - name: Ensure LLVM/libclang
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\libclang.dll")) {
            choco install llvm --version "$env:LLVM_VERSION" -y --no-progress
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check Windows prerequisites
        shell: cmd
        run: |
          where cmake
          where libclang.dll

      - name: Check Rust formatting
        shell: cmd
        run: scripts\windows-verify.cmd fmt

      - name: Lint Rust workspace
        shell: cmd
        run: scripts\windows-verify.cmd clippy

      - name: Test Rust workspace
        shell: cmd
        run: scripts\windows-verify.cmd test

  windows-build:
    name: Windows Tauri smoke build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        shell: pwsh
        run: rustup default stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Report Windows toolchain versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          bun --version

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-windows-tauri-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-tauri-${{ runner.os }}-
            cargo-windows-${{ runner.os }}-

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-windows-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-windows-${{ runner.os }}-

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Ensure LLVM/libclang
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\libclang.dll")) {
            choco install llvm --version "$env:LLVM_VERSION" -y --no-progress
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Typecheck frontend on Windows
        shell: pwsh
        run: bun run typecheck

      - name: Lint frontend on Windows
        shell: pwsh
        run: bun run lint

      - name: Test frontend on Windows
        shell: pwsh
        run: bun run test

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-cli --version "$env:TAURI_CLI_VERSION" --locked

      - name: Verify Tauri CLI
        shell: pwsh
        run: cargo tauri --version

      - name: Cache sccache binary
        id: cache-sccache-bin
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ github.workspace }}\.tools\sccache\bin\sccache.exe
          key: sccache-bin-${{ runner.os }}-${{ env.SCCACHE_VERSION }}

      - name: Install sccache
        if: steps.cache-sccache-bin.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:GITHUB_WORKSPACE ".tools\sccache"
          cargo install sccache --version "$env:SCCACHE_VERSION" --locked --root "$installRoot"

      - name: Cache sccache artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ github.workspace }}\.sccache
          key: sccache-windows-tauri-v2-${{ runner.os }}-stable-${{ env.SCCACHE_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-windows-tauri-v2-${{ runner.os }}-stable-${{ env.SCCACHE_VERSION }}-

      - name: Configure sccache
        shell: pwsh
        run: |
          $sccacheExe = Join-Path $env:GITHUB_WORKSPACE ".tools\sccache\bin\sccache.exe"
          if (-not (Test-Path $sccacheExe)) {
            Write-Warning "sccache is unavailable; continuing without RUSTC_WRAPPER."
            exit 0
          }
          $sccacheDir = Join-Path $env:GITHUB_WORKSPACE ".sccache"
          New-Item -ItemType Directory -Force $sccacheDir | Out-Null
          $env:RUSTC_WRAPPER = $sccacheExe
          $env:SCCACHE_DIR = $sccacheDir
          $env:SCCACHE_CACHE_SIZE = "2G"
          "RUSTC_WRAPPER=$env:RUSTC_WRAPPER" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SCCACHE_DIR=$env:SCCACHE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SCCACHE_CACHE_SIZE=$env:SCCACHE_CACHE_SIZE" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $sccacheExe --version
          & $sccacheExe --zero-stats

      - name: Build Windows Tauri app without bundling
        shell: cmd
        run: scripts\windows-verify.cmd build

      - name: Report sccache stats
        if: always()
        shell: pwsh
        run: |
          $sccacheExe = Join-Path $env:GITHUB_WORKSPACE ".tools\sccache\bin\sccache.exe"
          if (Test-Path $sccacheExe) {
            & $sccacheExe --show-stats
          }
