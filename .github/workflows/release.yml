name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq p7zip-full libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev libespeak-dev cmake ninja-build clang lld llvm pkg-config
      - run: make test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Install release dependencies
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract clang-19 cmake file jq lld-19 llvm-19 llvm-19-tools minisign ninja-build p7zip-full patchelf zip libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev libespeak-dev
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/n/nsis/nsis-common_3.09-4ubuntu1_all.deb
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/n/nsis/nsis_3.09-4ubuntu1_amd64.deb
          printf '%s  %s\n' \
            '49471b9debdee4751ebb4caf6b705cc4c678eebfaecefbe56362258893f85859' 'nsis-common_3.09-4ubuntu1_all.deb' \
            '9e061bef1a8b611aeb2ea76d9a3bd7722b960ca1a9dff8e38d2ab51e5a8f5e5b' 'nsis_3.09-4ubuntu1_amd64.deb' | sha256sum -c -
          sudo apt-get install -y ./nsis-common_3.09-4ubuntu1_all.deb ./nsis_3.09-4ubuntu1_amd64.deb
          cargo install cargo-xwin --version 0.23.0 --locked
          cargo install tauri-cli --version 2.11.1 --locked
          printf '%s\n' '/usr/lib/llvm-19/bin' '${{ github.workspace }}/scripts/windows-cross' >> "$GITHUB_PATH"
      - name: Compute candidate identity
        id: version
        env:
          CI_RUN_NUMBER: ${{ github.run_number }}
        run: |
          app_version="$(scripts/release-version.sh "$(git show -s --format=%ct HEAD)" "$CI_RUN_NUMBER")"
          printf 'app_version=%s\ntag=v%s\n' "$app_version" "$app_version" >> "$GITHUB_OUTPUT"
      - name: Verify release eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TARGET_SHA: ${{ github.sha }}
        run: scripts/preflight-release.sh "$GITHUB_REPOSITORY" "$TAG" "$APP_VERSION" "$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Prepare pinned AppImage tools
        if: steps.eligibility.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make prepare-appimage-tools
      - name: Build Linux AppImage with pinned Tauri action
        id: linux
        if: steps.eligibility.outputs.build == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: cargo-tauri
          args: --bundles appimage --no-sign --config '{"version":"${{ steps.version.outputs.app_version }}","bundle":{"createUpdaterArtifacts":false}}'
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: VoxGolem ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadPlainBinary: false
          releaseAssetNamePattern: vox-golem-linux-x86_64-v[version][ext]
      - name: Finalize AppImage and stage Linux ZIP from the same binary
        if: steps.eligibility.outputs.build == 'true'
        run: |
          make prepare-appimage-tools postprocess-update-bundle stage-linux-existing
          make verify-update-bundle
      - name: Prepare Windows native bundle inputs
        if: steps.eligibility.outputs.build == 'true'
        run: make prepare-pc-bundle
      - name: Build Windows NSIS with pinned Tauri action
        if: steps.eligibility.outputs.build == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VOXGOLEM_REAL_CLANG_CL: /usr/bin/clang-19
          VOXGOLEM_ESPEAK_COMPAT_HEADER: ${{ github.workspace }}/target/cross-shims/espeak_windows_compat.h
          CMAKE_GENERATOR: Ninja
          RUSTFLAGS: -L native=${{ github.workspace }}/target/import-libs
        with:
          tauriScript: cargo-tauri
          args: --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis --no-sign --config '{"version":"${{ steps.version.outputs.app_version }}","bundle":{"createUpdaterArtifacts":false}}'
          releaseId: ${{ steps.linux.outputs.releaseId }}
          tagName: ${{ steps.version.outputs.tag }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadPlainBinary: false
          releaseAssetNamePattern: vox-golem-windows-x86_64-v[version][setup][ext]
      - name: Sign and validate final canonical bytes
        if: steps.eligibility.outputs.build == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TAG: ${{ steps.version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mapfile -t appimages < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          test "${#appimages[@]}" -eq 1
          installer="target/x86_64-pc-windows-msvc/release/bundle/nsis/VoxGolem_${APP_VERSION}_x64-setup.exe"
          scripts/finalize-release-assets.sh "${appimages[0]}" dist/VoxGolem "$installer" "$APP_VERSION" "$TAG"
          scripts/verify-windows-installer.sh "$installer" 250000000
          printf 'Automated release from %s.\n' "$GITHUB_SHA" > release-notes.md
      - name: Complete and publish draft
        if: steps.eligibility.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-draft-release.sh "$GITHUB_REPOSITORY" "${{ steps.version.outputs.tag }}" "$GITHUB_SHA" "$GITHUB_WORKSPACE/dist-final" release-notes.md
