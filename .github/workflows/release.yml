name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate calendar version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          date_part="$(date -u +'%Y.%m.%d')"
          next_daily_number=1

          while IFS= read -r tag; do
            suffix="${tag##*.}"
            case "$suffix" in
              ''|*[!0-9]*)
                continue
                ;;
            esac

            suffix_number=$((10#$suffix))
            if [ "$suffix_number" -ge "$next_daily_number" ]; then
              next_daily_number=$((suffix_number + 1))
            fi
          done <<EOF
          $(git tag --list "v${date_part}.*")
          EOF

          version="v${date_part}.${next_daily_number}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Determine release scope
        id: release_scope
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force

          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${TARGET_SHA}^" 2>/dev/null || true)"

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            tag_target="$(git rev-list -n 1 "$VERSION")"
            if [ "$tag_target" != "$TARGET_SHA" ]; then
              printf 'Refusing to publish %s because tag %s already points at %s.\n' "$TARGET_SHA" "$VERSION" "$tag_target" >&2
              exit 1
            fi
          fi

          existing_release_tags="$(git tag --points-at "$TARGET_SHA" --list 'v[0-9]*' || true)"
          if [ -z "$existing_release_tags" ]; then
            existing_release_tags="$(gh api "repos/${REPOSITORY}/releases" --paginate --jq ".[] | select(.target_commitish == \"${TARGET_SHA}\") | .tag_name" | head -n 1)"
          fi

          if [ -n "$existing_release_tags" ]; then
            while IFS= read -r existing_tag; do
              [ -n "$existing_tag" ] || continue

              release_assets="$(gh release view "$existing_tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
              missing_assets=false

              for required_asset in "vox-golem-${existing_tag}.zip" 'SHA256SUMS'; do
                if ! printf '%s\n' "$release_assets" | grep -Fxq "$required_asset"; then
                  printf 'Existing release %s is missing required asset %s.\n' "$existing_tag" "$required_asset" >&2
                  missing_assets=true
                fi
              done

              if [ "$missing_assets" = true ]; then
                printf 'Refusing to create a second release for %s while %s is incomplete.\n' "$TARGET_SHA" "$existing_tag" >&2
                exit 1
              fi

              printf 'Release %s already targets %s; skipping duplicate release.\n' "$existing_tag" "$TARGET_SHA"
              {
                printf 'previous_tag=%s\n' "$previous_tag"
                printf 'should_publish=false\n'
                printf 'skip_reason=%s\n' "release ${existing_tag} already targets this commit"
              } >> "$GITHUB_OUTPUT"
              exit 0
            done <<EOF
          $existing_release_tags
          EOF
          fi

          if [ -z "$previous_tag" ]; then
            printf 'No previous tag found; publishing initial release.\n'
            {
              printf 'previous_tag=\n'
              printf 'should_publish=true\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${previous_tag}..${TARGET_SHA}")"
          has_release_artifact_input_change=false

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            case "$path" in
              Makefile|apps/*|crates/*|frontend/*|Cargo.toml|Cargo.lock|bun.lock|package.json|tsconfig.base.json|config.example.toml)
                has_release_artifact_input_change=true
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          printf 'Changed files since %s:\n%s\n' "$previous_tag" "$changed_files"
          {
            printf 'previous_tag=%s\n' "$previous_tag"
            printf 'should_publish=%s\n' "$has_release_artifact_input_change"
            if [ "$has_release_artifact_input_change" != true ]; then
              printf 'skip_reason=%s\n' 'no release artifact inputs changed'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Skip release
        if: steps.release_scope.outputs.should_publish != 'true'
        run: |
          printf 'Skipping release: %s.\n' "${{ steps.release_scope.outputs.skip_reason }}"

      - name: Confirm main still targets released commit
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse FETCH_HEAD)"

          if [ "$current_main" != "$TARGET_SHA" ]; then
            printf 'Refusing to publish %s because origin/main is now %s.\n' "$TARGET_SHA" "$current_main" >&2
            exit 1
          fi

      - name: Download Windows app artifact from CI
        if: steps.release_scope.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vox-golem-windows-app
          path: package/VoxGolem
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create release zip
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          (cd package && zip -r -D "../dist/vox-golem-${VERSION}.zip" VoxGolem)

      - name: Verify release zip contents
        if: steps.release_scope.outputs.should_publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip_path="dist/vox-golem-${VERSION}.zip"
          mapfile -t actual_files < <(zipinfo -1 "$zip_path" | sort)

          printf 'Packaged files in %s:\n' "$zip_path"
          printf '%s\n' "${actual_files[@]}"

          required_files=(
            "VoxGolem/config.toml"
            "VoxGolem/vox-golem.exe"
            "VoxGolem/onnxruntime_providers_cuda.dll"
            "VoxGolem/onnxruntime_providers_shared.dll"
            "VoxGolem/cublas64_12.dll"
            "VoxGolem/cublasLt64_12.dll"
            "VoxGolem/cudart64_12.dll"
            "VoxGolem/cudnn64_9.dll"
            "VoxGolem/cudnn_adv64_9.dll"
            "VoxGolem/cudnn_cnn64_9.dll"
            "VoxGolem/cudnn_engines_precompiled64_9.dll"
            "VoxGolem/cudnn_engines_runtime_compiled64_9.dll"
            "VoxGolem/cudnn_graph64_9.dll"
            "VoxGolem/cudnn_heuristic64_9.dll"
            "VoxGolem/cudnn_ops64_9.dll"
            "VoxGolem/cufft64_11.dll"
          )

          missing_files=()
          for required_file in "${required_files[@]}"; do
            found=false
            for actual_file in "${actual_files[@]}"; do
              if [ "$actual_file" = "$required_file" ]; then
                found=true
                break
              fi
            done

            if [ "$found" != true ]; then
              missing_files+=("$required_file")
            fi
          done

          if [ "${#missing_files[@]}" -gt 0 ]; then
            printf 'Missing required release files:\n' >&2
            printf '%s\n' "${missing_files[@]}" >&2
            exit 1
          fi

          allowed_files=(
            "${required_files[@]}"
            "VoxGolem/DirectML.dll"
            "VoxGolem/onnxruntime.dll"
            "VoxGolem/onnxruntime_providers_nv_tensorrt_rtx.dll"
            "VoxGolem/onnxruntime_providers_tensorrt.dll"
          )

          unexpected_files=()
          for actual_file in "${actual_files[@]}"; do
            allowed=false
            for allowed_file in "${allowed_files[@]}"; do
              if [ "$actual_file" = "$allowed_file" ]; then
                allowed=true
                break
              fi
            done

            if [ "$allowed" != true ]; then
              unexpected_files+=("$actual_file")
            fi
          done

          if [ "${#unexpected_files[@]}" -gt 0 ]; then
            printf 'Unexpected release files:\n' >&2
            printf '%s\n' "${unexpected_files[@]}" >&2
            exit 1
          fi

      - name: Generate release checksums
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum "vox-golem-${VERSION}.zip" > SHA256SUMS

      - name: Generate release notes
        if: steps.release_scope.outputs.should_publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIOUS_TAG: ${{ steps.release_scope.outputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            commit_range="${PREVIOUS_TAG}..${TARGET_SHA}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${VERSION}"
          else
            commit_range="$TARGET_SHA"
            compare_url=""
          fi

          commit_lines="$(git log --reverse --pretty=format:'- %s (%h)' "$commit_range")"

          {
            printf '## Changes\n\n'

            if [ -n "$commit_lines" ]; then
              printf '%s\n' "$commit_lines"
            else
              printf -- '- No commit changes detected.\n'
            fi

            printf '\n## Artifacts\n\n'
            printf -- "- Windows app: \`VoxGolem/vox-golem.exe\`\n"
            printf -- "- Config template: \`VoxGolem/config.toml\`\n"
            printf -- "- CUDA/cuDNN runtime DLLs staged beside the app executable\n"
            printf -- "- Checksums: \`SHA256SUMS\`\n"

            printf '\n## Verification\n\n'
            printf -- "- CI \`workflow-lint\`\n"
            printf -- "- CI \`linux-checks\`\n"
            printf -- "- CI \`windows-artifact\`\n"

            printf '\n## Full changelog\n\n'

            if [ -n "$compare_url" ]; then
              printf '%s\n' "$compare_url"
            else
              printf 'Initial release from %s.\n' "$TARGET_SHA"
            fi
          } > release-notes.md

      - name: Publish release
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse FETCH_HEAD)"

          if [ "$current_main" != "$TARGET_SHA" ]; then
            printf 'Refusing to publish %s because origin/main is now %s.\n' "$TARGET_SHA" "$current_main" >&2
            exit 1
          fi

          gh release create "$VERSION" dist/* \
            --target "$TARGET_SHA" \
            --title "VoxGolem ${VERSION}" \
            --notes-file release-notes.md \
            --latest
