name: Linux CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.9
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.11.1

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust fmt, clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use stable Rust
        run: rustup default stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

  tauri-smoke-build:
    name: Tauri Linux smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - frontend
      - rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Cargo registry and build output
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-tauri-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-tauri-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Build Tauri app without bundling
        run: |
          mkdir -p target
          cat > target/ci-tauri-config.json <<'JSON'
          {"build":{"beforeBuildCommand":"true"}}
          JSON
          cargo tauri build --config target/ci-tauri-config.json --no-bundle
        working-directory: apps/windows-tauri/src-tauri
