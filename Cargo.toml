[workspace]
resolver = "2"
members = [
  "apps/android-tauri/src-tauri",
  "apps/desktop-tauri/src-tauri",
  "crates/audio",
  "crates/assistant-plugin",
  "crates/capture-plugin",
  "crates/core",
  "crates/model",
  "crates/platform",
  "crates/wear-assistant-native"
]

[workspace.package]
edition = "2021"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
